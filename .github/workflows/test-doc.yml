name: Validate documentation

on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt PyYAML
      - name: Check documented files and commands
        run: python scripts/check_documentation.py
      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
