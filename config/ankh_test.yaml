log_path: ~/FANTASIA/logs/
constants: ./fantasia/constants.yaml
base_directory: ~/fantasia_runs/
prefix: ankh_test
limit_execution: 20
monitor_interval: 10
input: data_sample/sample.fasta
only_lookup: False
only_embedding: False

DB_USERNAME: usuario
DB_PASSWORD: clave
DB_HOST: localhost
DB_PORT: 5432
DB_NAME: BioData

rabbitmq_host: localhost
rabbitmq_port: 5672
rabbitmq_user: guest
rabbitmq_password: guest
delete_queues: true

embedding:
  device: cuda
  queue_batch_size: 100
  max_sequence_length: 0
  models:
    ESM:
      repository: facebook/esm2_t33_650M_UR50D
      revision: 08e4846e537177426273712802403f7ba8261b6c
      enabled: False
      batch_size: 1
      layer_index: [0]
      distance_threshold: false
    ESM3c:
      repository: EvolutionaryScale/esmc-600m-2024-12
      revision: e4d83bc7e10fd55c92e598e545f4a76bf04a6e5c
      enabled: False
      batch_size: 1
      layer_index: [0]
      distance_threshold: false
    Ankh3-Large:
      repository: ElnaggarLab/ankh3-large
      revision: 2be091622e8a393f0ef21735070084123c874b6e
      enabled: True
      batch_size: 1
      layer_index: [0]
      distance_threshold: false
    Prot-T5:
      repository: Rostlab/prot_t5_xl_uniref50
      revision: 973be27c52ee6474de9c945952a8008aeb2a1a73
      enabled: False
      batch_size: 1
      layer_index: [0]
      distance_threshold: false
    Prost-T5:
      repository: Rostlab/ProstT5
      revision: d7d097d5bf9a993ab8f68488b4681d6ca70db9e5
      enabled: False
      batch_size: 1
      layer_index: [0]
      distance_threshold: false

lookup:
  use_gpu: true
  batch_size: 516
  distance_metric: cosine
  limit_per_entry: 1
  lookup_cache_max: 1
  topgo: false
  precision: 4

redundancy:
  identity: 0
  coverage: 0.7
  threads: 10

taxonomy:
  exclude: []
  include_only: []
  get_descendants: false  # Deprecated and disabled; true is rejected

postprocess:
  keep_sequences: true
  summary:
    include_counts: true
    normalize_count_by_limit_per_entry: true
    export_raw_count: true
    metrics:
      reliability_index: [max]
      identity: [min, max, mean]
      identity_sw: [min, max, mean]
    aliases:
      reliability_index: ri
      identity: id_g
      identity_sw: id_l
    weights:
      reliability_index: {max: 0.4}
      max_id_g: 0.20
      max_id_l: 0.20
      count: 0.2
    weighted_prefix: "w_"
